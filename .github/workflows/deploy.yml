name: Deploy to GitHub Pages

# Run workflow on every push to the main branch
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-to-github-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    # Checkout the code
    - name: Checkout
      uses: actions/checkout@v4

    # Setup .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '9.0.x'

    # Publish Blazor project to release folder
    - name: Publish .NET Project
      run: dotnet publish ForbiddenPsalmBuilder/ForbiddenPsalmBuilder.Blazor/ForbiddenPsalmBuilder.Blazor.csproj -c Release -o release --nologo

    # Copy CNAME file for custom domain
    - name: Copy CNAME file
      run: cp CNAME release/wwwroot/CNAME

    # Add .nojekyll file to tell GitHub pages to not treat this as a Jekyll project
    # (GitHub Pages uses Jekyll by default which doesn't serve files/folders starting with underscore)
    - name: Add .nojekyll file
      run: touch release/wwwroot/.nojekyll

    # Copy index.html to 404.html to serve the same file when a file is not found (SPA routing)
    - name: Copy index.html to 404.html
      run: cp release/wwwroot/index.html release/wwwroot/404.html

    # Upload artifact for GitHub Pages
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'release/wwwroot'

    # Deploy to GitHub Pages
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
